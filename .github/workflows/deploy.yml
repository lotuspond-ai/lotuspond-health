# Checks every push to main and development, then deploys it:
#   main        → the "production" GitHub environment (https://health.lotuspond.ai)
#   development → the "staging" GitHub environment (its own server; skipped until configured)
# Deploying = SSH to the server, whose key may only run deploy/remote-deploy.sh with the commit to deploy.
# Setup (secrets, server key, environments): deploy/ci-cd.md.
name: Deploy

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The record agent's tests drive a real headless Chromium through playwright-core (server/src/records/browsers.ts).
      # Install the exact build playwright-core expects, with its system libraries, as the Dockerfile does.
      - run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    needs: checks
    if: github.ref_name == 'main' || github.ref_name == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}
    # One deploy at a time per server; a newer push waits for the running one instead of cutting it off mid-build.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Check the environment is configured
        id: configured
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::No DEPLOY_HOST for this environment yet; skipping the deploy (see deploy/ci-cd.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ github.sha }}
        if: steps.configured.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's authorized_keys entry forces remote-deploy.sh; this argument is only the commit to deploy.
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Check the site answers
        if: steps.configured.outputs.ok == 'true' && env.DEPLOY_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$DEPLOY_URL/api/health" | grep -q '"ok":true'; then echo "Healthy."; exit 0; fi
            sleep 10
          done
          echo "::error::$DEPLOY_URL/api/health did not answer ok within 5 minutes."
          exit 1
