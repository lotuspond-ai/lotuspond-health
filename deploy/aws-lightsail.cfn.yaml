AWSTemplateFormatVersion: "2010-09-09"
# Created by aws-lightsail-cfn.sh. Mumbai bundle IDs end in _3_1 (medium_3_0 exists only in other regions).
Description: LotusPond Health server in Mumbai (Lightsail instance, static IP, firewall, daily snapshots). See deploy/aws-lightsail.md.
Parameters:
  UserData:
    Type: String
    NoEcho: true
    Description: First-boot script from aws-lightsail-firstboot.sh, rendered by aws-lightsail-cfn.sh (holds the read-only GitHub deploy key)
Resources:
  Server:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: lotuspond-health-in
      AvailabilityZone: ap-south-1a
      BlueprintId: ubuntu_24_04
      BundleId: medium_3_1
      UserData: !Ref UserData
      AddOns:
        - AddOnType: AutoSnapshot
          Status: Enabled
          AutoSnapshotAddOnRequest:
            SnapshotTimeOfDay: "21:00"
      Networking:
        Ports:
          - {FromPort: 22, ToPort: 22, Protocol: tcp, Cidrs: ["0.0.0.0/0"], Ipv6Cidrs: ["::/0"]}
          - {FromPort: 80, ToPort: 80, Protocol: tcp, Cidrs: ["0.0.0.0/0"], Ipv6Cidrs: ["::/0"]}
          - {FromPort: 443, ToPort: 443, Protocol: tcp, Cidrs: ["0.0.0.0/0"], Ipv6Cidrs: ["::/0"]}
          - {FromPort: 443, ToPort: 443, Protocol: udp, Cidrs: ["0.0.0.0/0"], Ipv6Cidrs: ["::/0"]}
      Tags:
        - {Key: project, Value: lotuspond-health}
  StaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: lotuspond-health-in-ip
      AttachedTo: !Ref Server
Outputs:
  StaticIpAddress:
    Value: !GetAtt StaticIp.IpAddress
  Ipv6Addresses:
    Value: !Join [",", !GetAtt Server.Ipv6Addresses]
